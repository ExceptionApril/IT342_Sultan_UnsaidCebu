# Database – Supabase PostgreSQL via Session Pooler (IPv4)
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD
# (See unsaidcebu/.env.example for setup; run.ps1 loads them from .env.)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT – required env var: JWT_SECRET (must be >= 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Server
server.port=8080
